# Server Configuration
server.port=8080

# Application Name
spring.application.name=TransitOps

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Babyproject

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
# Using update to automatically create/update schemas as requested
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.hackhathon=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Storage Properties (Custom)
app.upload.dir=uploads/

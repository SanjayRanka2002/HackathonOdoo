<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head(${driver.id == null ? 'Enlist Operator' : 'Edit Operator Details'})}"></head>
<body>

    <!-- Sidebar Inclusion -->
    <div th:replace="~{fragments/sidebar :: sidebar('drivers')}"></div>

    <!-- Top Navbar Inclusion -->
    <div th:replace="~{fragments/header :: top-navbar(${driver.id == null ? 'Enlist Operator' : 'Edit Operator Details'})}"></div>
    
    <!-- Main Content Area -->
    <div class="content-wrapper">
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="transit-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="mb-0 text-light">
                            <i class="fa-solid fa-user-plus me-2 text-indigo"></i>
                            <span th:text="${driver.id == null ? 'Driver Enlistment Form' : 'Update Roster for ' + driver.driverName}">Form</span>
                        </h5>
                        <a th:href="@{/drivers}" class="btn btn-transit-outline btn-sm">
                            <i class="fa-solid fa-arrow-left me-2"></i>Back to Roster
                        </a>
                    </div>

                    <form th:action="${driver.id == null} ? @{/drivers/new} : @{/drivers/edit/{id}(id=${driver.id})}" 
                          th:object="${driver}" method="post">
                        
                        <div class="row g-4">
                            <!-- Driver Name -->
                            <div class="col-md-6">
                                <label for="driverName" class="form-label text-secondary font-weight-bold">Driver Full Name</label>
                                <input type="text" id="driverName" th:field="*{driverName}" class="form-control transit-form-control" placeholder="e.g. John Doe" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('driverName')}" th:errors="*{driverName}">Error</div>
                            </div>

                            <!-- license number -->
                            <div class="col-md-6">
                                <label for="licenseNumber" class="form-label text-secondary font-weight-bold">Commercial License Number</label>
                                <input type="text" id="licenseNumber" th:field="*{licenseNumber}" class="form-control transit-form-control" placeholder="e.g. DL-AZ98715" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('licenseNumber')}" th:errors="*{licenseNumber}">Error</div>
                            </div>

                            <!-- license category -->
                            <div class="col-md-4">
                                <label for="licenseCategory" class="form-label text-secondary font-weight-bold">License Class Category</label>
                                <select id="licenseCategory" th:field="*{licenseCategory}" class="form-select transit-form-control" required>
                                    <option value="Class A CDL">Class A CDL (Heavy/Trailer)</option>
                                    <option value="Class B CDL">Class B CDL (Single/Cargo)</option>
                                    <option value="Class C CDL">Class C CDL (Medium/HazMat)</option>
                                    <option value="Standard Light">Standard Light Commercial</option>
                                </select>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('licenseCategory')}" th:errors="*{licenseCategory}">Error</div>
                            </div>

                            <!-- license Expiry Date -->
                            <div class="col-md-4">
                                <label for="expiryDate" class="form-label text-secondary font-weight-bold">License Expiry Date</label>
                                <input type="date" id="expiryDate" th:field="*{expiryDate}" class="form-control transit-form-control" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}">Error</div>
                            </div>

                            <!-- Safety Rating -->
                            <div class="col-md-4">
                                <label for="safetyScore" class="form-label text-secondary font-weight-bold">Safety Score Assessment</label>
                                <input type="number" step="0.1" min="1.0" max="5.0" id="safetyScore" th:field="*{safetyScore}" class="form-control transit-form-control" placeholder="e.g. 4.8">
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('safetyScore')}" th:errors="*{safetyScore}">Error</div>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <label for="phone" class="form-label text-secondary font-weight-bold">Contact Mobile Phone</label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control transit-form-control" placeholder="+1 (555) 019-2834" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label text-secondary font-weight-bold">Active Email Address</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control transit-form-control" placeholder="johndoe@transitops.com" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                            </div>

                            <!-- Address -->
                            <div class="col-md-12">
                                <label for="address" class="form-label text-secondary font-weight-bold">Residential/Current Address</label>
                                <input type="text" id="address" th:field="*{address}" class="form-control transit-form-control" placeholder="123 Highway Lane, City, State ZIP">
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Error</div>
                            </div>

                            <!-- Emergency Contact -->
                            <div class="col-md-6">
                                <label for="emergencyContact" class="form-label text-secondary font-weight-bold">Emergency Contact Listing</label>
                                <input type="text" id="emergencyContact" th:field="*{emergencyContact}" class="form-control transit-form-control" placeholder="e.g. Spouse - Name/Phone">
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('emergencyContact')}" th:errors="*{emergencyContact}">Error</div>
                            </div>

                            <!-- Driver State -->
                            <div class="col-md-6">
                                <label for="status" class="form-label text-secondary font-weight-bold">Operational Status State</label>
                                <select id="status" th:field="*{status}" class="form-select transit-form-control" required>
                                    <option value="AVAILABLE">AVAILABLE</option>
                                    <option value="ON_TRIP">ON_TRIP</option>
                                    <option value="SUSPENDED">SUSPENDED</option>
                                </select>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Error</div>
                            </div>
                        </div>

                        <!-- Actions Buttons -->
                        <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
                            <a th:href="@{/drivers}" class="btn btn-transit-outline px-4">Cancel</a>
                            <button type="submit" class="btn btn-transit px-4">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Save Operator
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts Inclusion -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Dispatch Route')}"></head>
<body>

    <!-- Sidebar Inclusion -->
    <div th:replace="~{fragments/sidebar :: sidebar('trips')}"></div>

    <!-- Top Navbar Inclusion -->
    <div th:replace="~{fragments/header :: top-navbar('Dispatch Route')}"></div>
    
    <!-- Main Content Area -->
    <div class="content-wrapper">
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="transit-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="mb-0 text-light">
                            <i class="fa-solid fa-plane-departure me-2 text-indigo"></i>
                            <span>Route Dispatch Assignment</span>
                        </h5>
                        <a th:href="@{/trips}" class="btn btn-transit-outline btn-sm">
                            <i class="fa-solid fa-arrow-left me-2"></i>Back to Trips log
                        </a>
                    </div>

                    <form th:action="@{/trips/new}" th:object="${trip}" method="post">
                        
                        <div class="row g-4">
                            <!-- Source -->
                            <div class="col-md-6">
                                <label for="source" class="form-label text-secondary font-weight-bold">Source/Start Point</label>
                                <input type="text" id="source" th:field="*{source}" class="form-control transit-form-control" placeholder="e.g. New York Hub" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('source')}" th:errors="*{source}">Error</div>
                            </div>

                            <!-- Destination -->
                            <div class="col-md-6">
                                <label for="destination" class="form-label text-secondary font-weight-bold">Destination/Target Terminal</label>
                                <input type="text" id="destination" th:field="*{destination}" class="form-control transit-form-control" placeholder="e.g. Los Angeles Dock" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}">Error</div>
                            </div>

                            <!-- Distance -->
                            <div class="col-md-6">
                                <label for="distance" class="form-label text-secondary font-weight-bold">Estimated Route Distance (km)</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" id="distance" th:field="*{distance}" class="form-control transit-form-control" placeholder="e.g. 450.5" required>
                                    <span class="input-group-text bg-dark border-secondary text-secondary">km</span>
                                </div>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('distance')}" th:errors="*{distance}">Error</div>
                            </div>

                            <!-- Payload Cargo weight -->
                            <div class="col-md-6">
                                <label for="cargoWeight" class="form-label text-secondary font-weight-bold">Cargo Payload (Tons)</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" id="cargoWeight" th:field="*{cargoWeight}" class="form-control transit-form-control" placeholder="e.g. 15.6" required>
                                    <span class="input-group-text bg-dark border-secondary text-secondary">Tons</span>
                                </div>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('cargoWeight')}" th:errors="*{cargoWeight}">Error</div>
                            </div>

                            <!-- Vehicle Selector -->
                            <div class="col-md-6">
                                <label for="vehicleId" class="form-label text-secondary font-weight-bold">Assign Asset Vehicle (Available)</label>
                                <select id="vehicleId" name="vehicleId" class="form-select transit-form-control" required>
                                    <option value="" disabled selected>-- Select Available Truck --</option>
                                    <option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.vehicleName + ' (' + v.registrationNumber + ') • Cap: ' + v.loadCapacity + ' Tons'}"></option>
                                </select>
                            </div>

                            <!-- Driver Selector -->
                            <div class="col-md-6">
                                <label for="driverId" class="form-label text-secondary font-weight-bold">Assign Operator Driver (Available)</label>
                                <select id="driverId" name="driverId" class="form-select transit-form-control" required>
                                    <option value="" disabled selected>-- Select Available Driver --</option>
                                    <option th:each="d : ${drivers}" th:value="${d.id}" th:text="${d.driverName + ' • CDL: ' + d.licenseCategory + ' • Score: ' + d.safetyScore}"></option>
                                </select>
                            </div>

                            <!-- Initial dispatch State -->
                            <div class="col-md-6">
                                <label for="status" class="form-label text-secondary font-weight-bold">Operational Dispatch State</label>
                                <select id="status" th:field="*{status}" class="form-select transit-form-control" required>
                                    <option value="DISPATCHED">DISPATCHED</option>
                                </select>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Error</div>
                            </div>
                        </div>

                        <!-- Actions Buttons -->
                        <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
                            <a th:href="@{/trips}" class="btn btn-transit-outline px-4">Cancel</a>
                            <button type="submit" class="btn btn-transit px-4">
                                <i class="fa-solid fa-paper-plane me-2"></i>Dispatch Route
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts Inclusion -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head(${maintenance.id == null ? 'Schedule Service' : 'Edit Service Log'})}"></head>
<body>

    <!-- Sidebar Inclusion -->
    <div th:replace="~{fragments/sidebar :: sidebar('maintenance')}"></div>

    <!-- Top Navbar Inclusion -->
    <div th:replace="~{fragments/header :: top-navbar(${maintenance.id == null ? 'Schedule Service' : 'Edit Service Log'})}"></div>
    
    <!-- Main Content Area -->
    <div class="content-wrapper">
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="transit-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="mb-0 text-light">
                            <i class="fa-solid fa-screwdriver-wrench me-2 text-indigo"></i>
                            <span th:text="${maintenance.id == null ? 'New Repair Shop Checkout' : 'Update Service Log specs'}">Shop Checkout</span>
                        </h5>
                        <a th:href="@{/maintenance}" class="btn btn-transit-outline btn-sm">
                            <i class="fa-solid fa-arrow-left me-2"></i>Back to Shop logs
                        </a>
                    </div>

                    <form th:action="${maintenance.id == null} ? @{/maintenance/new} : @{/maintenance/edit/{id}(id=${maintenance.id})}" 
                          th:object="${maintenance}" method="post">
                        
                        <div class="row g-4">
                            <!-- Vehicle Selector -->
                            <div class="col-md-6">
                                <label for="vehicleId" class="form-label text-secondary font-weight-bold">Select Fleet Asset/Truck</label>
                                <select id="vehicleId" name="vehicleId" class="form-select transit-form-control" required>
                                    <option value="" disabled selected>-- Select Vehicle --</option>
                                    <option th:each="v : ${vehicles}" 
                                            th:value="${v.id}" 
                                            th:selected="${maintenance.vehicle != null && maintenance.vehicle.id == v.id}"
                                            th:text="${v.vehicleName + ' (' + v.registrationNumber + ') • Status: ' + v.status}"></option>
                                </select>
                            </div>

                            <!-- cost estimation -->
                            <div class="col-md-6">
                                <label for="cost" class="form-label text-secondary font-weight-bold">Repair Cost Valuation (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary">₹</span>
                                    <input type="number" step="0.01" id="cost" th:field="*{cost}" class="form-control transit-form-control" placeholder="e.g. 350.00" required>
                                </div>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}">Error</div>
                            </div>

                            <!-- Description -->
                            <div class="col-md-12">
                                <label for="description" class="form-label text-secondary font-weight-bold">Job Description (Repairs details/Symptoms)</label>
                                <textarea id="description" th:field="*{description}" class="form-control transit-form-control" rows="3" placeholder="Describe component failures or maintenance actions..." required></textarea>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div>
                            </div>

                            <!-- Repair status state -->
                            <div class="col-md-6">
                                <label for="status" class="form-label text-secondary font-weight-bold">Shop Status State</label>
                                <select id="status" th:field="*{status}" class="form-select transit-form-control" required>
                                    <option value="SCHEDULED">SCHEDULED (Awaiting check-in)</option>
                                    <option value="IN_PROGRESS">IN_PROGRESS (On Service Bay)</option>
                                    <option value="COMPLETED">COMPLETED (Released to fleet)</option>
                                </select>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Error</div>
                            </div>
                        </div>

                        <!-- Actions Buttons -->
                        <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
                            <a th:href="@{/maintenance}" class="btn btn-transit-outline px-4">Cancel</a>
                            <button type="submit" class="btn btn-transit px-4">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Save Ticket
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts Inclusion -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

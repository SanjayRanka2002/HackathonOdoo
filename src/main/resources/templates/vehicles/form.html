<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head(${vehicle.id == null ? 'Add Vehicle Asset' : 'Edit Vehicle Asset'})}"></head>
<body>

    <!-- Sidebar Inclusion -->
    <div th:replace="~{fragments/sidebar :: sidebar('vehicles')}"></div>

    <!-- Top Navbar Inclusion -->
    <div th:replace="~{fragments/header :: top-navbar(${vehicle.id == null ? 'Add Vehicle Asset' : 'Edit Vehicle Asset'})}"></div>
    
    <!-- Main Content Area -->
    <div class="content-wrapper">
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="transit-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="mb-0 text-light">
                            <i class="fa-solid fa-truck-moving me-2 text-indigo"></i>
                            <span th:text="${vehicle.id == null ? 'New Vehicle Specifications' : 'Update Specifications for ' + vehicle.vehicleName}">Specs</span>
                        </h5>
                        <a th:href="@{/vehicles}" class="btn btn-transit-outline btn-sm">
                            <i class="fa-solid fa-arrow-left me-2"></i>Back to Fleet
                        </a>
                    </div>

                    <form th:action="${vehicle.id == null} ? @{/vehicles/new} : @{/vehicles/edit/{id}(id=${vehicle.id})}" 
                          th:object="${vehicle}" method="post">
                        
                        <div class="row g-4">
                            <!-- Vehicle Name -->
                            <div class="col-md-6">
                                <label for="vehicleName" class="form-label text-secondary font-weight-bold">Vehicle Maker/Model Name</label>
                                <input type="text" id="vehicleName" th:field="*{vehicleName}" class="form-control transit-form-control" placeholder="e.g. Volvo FH16" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('vehicleName')}" th:errors="*{vehicleName}">Error</div>
                            </div>

                            <!-- Registration Number -->
                            <div class="col-md-6">
                                <label for="registrationNumber" class="form-label text-secondary font-weight-bold">License Plate/Registration No.</label>
                                <input type="text" id="registrationNumber" th:field="*{registrationNumber}" class="form-control transit-form-control" placeholder="e.g. KA-01-ME-1234" required>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}">Error</div>
                            </div>

                            <!-- Vehicle Type -->
                            <div class="col-md-6">
                                <label for="vehicleType" class="form-label text-secondary font-weight-bold">Fleet Type / Classification</label>
                                <select id="vehicleType" th:field="*{vehicleType}" class="form-select transit-form-control" required>
                                    <option value="Heavy Truck">Heavy Truck</option>
                                    <option value="Medium Duty">Medium Duty</option>
                                    <option value="Cargo Truck">Cargo Truck</option>
                                    <option value="Trailer">Trailer</option>
                                    <option value="Reefer (Cold-Chain)">Reefer (Cold-Chain)</option>
                                    <option value="Other Utility">Other Utility</option>
                                </select>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}">Error</div>
                            </div>

                            <!-- Vehicle Sub-model info -->
                            <div class="col-md-6">
                                <label for="vehicleModel" class="form-label text-secondary font-weight-bold">Model details Year/Variant</label>
                                <input type="text" id="vehicleModel" th:field="*{vehicleModel}" class="form-control transit-form-control" placeholder="e.g. 2023 Globetrotter Custom">
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('vehicleModel')}" th:errors="*{vehicleModel}">Error</div>
                            </div>

                            <!-- Load Capacity -->
                            <div class="col-md-4">
                                <label for="loadCapacity" class="form-label text-secondary font-weight-bold">Max Load Limit (Tons)</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" id="loadCapacity" th:field="*{loadCapacity}" class="form-control transit-form-control" placeholder="e.g. 25.0" required>
                                    <span class="input-group-text bg-dark border-secondary text-secondary">Tons</span>
                                </div>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('loadCapacity')}" th:errors="*{loadCapacity}">Error</div>
                            </div>

                            <!-- Odometer -->
                            <div class="col-md-4">
                                <label for="currentOdometer" class="form-label text-secondary font-weight-bold">Current Mileage Odometer</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" id="currentOdometer" th:field="*{currentOdometer}" class="form-control transit-form-control" placeholder="e.g. 120500" required>
                                    <span class="input-group-text bg-dark border-secondary text-secondary">km</span>
                                </div>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('currentOdometer')}" th:errors="*{currentOdometer}">Error</div>
                            </div>

                            <!-- Purchase Cost -->
                            <div class="col-md-4">
                                <label for="purchaseCost" class="form-label text-secondary font-weight-bold">Asset Valuation/Cost</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary">₹</span>
                                    <input type="number" step="0.01" id="purchaseCost" th:field="*{purchaseCost}" class="form-control transit-form-control" placeholder="e.g. 135000">
                                </div>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('purchaseCost')}" th:errors="*{purchaseCost}">Error</div>
                            </div>

                            <!-- Operational Status -->
                            <div class="col-md-6">
                                <label for="status" class="form-label text-secondary font-weight-bold">Operational Status</label>
                                <select id="status" th:field="*{status}" class="form-select transit-form-control" required>
                                    <option value="AVAILABLE">AVAILABLE</option>
                                    <option value="ON_TRIP">ON_TRIP</option>
                                    <option value="IN_SHOP">IN_SHOP</option>
                                    <option value="RETIRED">RETIRED</option>
                                </select>
                                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Error</div>
                            </div>
                        </div>

                        <!-- Actions Buttons -->
                        <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
                            <a th:href="@{/vehicles}" class="btn btn-transit-outline px-4">Cancel</a>
                            <button type="submit" class="btn btn-transit px-4">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Save Vehicle
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts Inclusion -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

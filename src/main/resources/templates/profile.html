<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('User Settings')}"></head>
<body>

    <!-- Sidebar Inclusion -->
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>

    <!-- Top Navbar Inclusion -->
    <div th:replace="~{fragments/header :: top-navbar('Account Settings')}"></div>

    <!-- Main Content Area -->
    <div class="content-wrapper">
        
        <!-- Alerts block -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMessage}">Success!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-xmark me-2"></i>
            <span th:text="${errorMessage}">Error occurred!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <!-- Left Side: User Card Info -->
            <div class="col-lg-4">
                <div class="transit-card text-center py-5">
                    <div class="p-3 border border-secondary rounded-circle bg-dark d-inline-flex align-items-center justify-content-center mb-4" style="width: 100px; height: 100px;">
                        <i class="fa-solid fa-user-tie text-secondary display-3"></i>
                    </div>
                    <h4 class="text-light mb-1" th:text="${user.firstName + ' ' + user.lastName}">John Smith</h4>
                    <p class="badge bg-transit border border-secondary text-info p-2 mb-4" th:text="${user.role != null ? user.role.name : 'GUEST'}">ADMIN</p>
                    
                    <div class="text-start border-top border-secondary pt-4 mt-2">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary small">Username:</span>
                            <span class="text-light font-weight-bold" th:text="${user.username}">username</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary small">Access Status:</span>
                            <span class="text-success font-weight-bold" th:text="${user.active} ? 'ACTIVE' : 'SUSPENDED'">ACTIVE</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-secondary small">Email:</span>
                            <span class="text-light" th:text="${user.email}">user@transitops.com</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Edit Settings Form -->
            <div class="col-lg-8">
                <div class="transit-card">
                    <h5 class="mb-4 text-light"><i class="fa-solid fa-gear me-2 text-indigo"></i>Modify Profile Details</h5>
                    
                    <form th:action="@{/profile/update}" method="post">
                        
                        <div class="row g-3">
                            <!-- First Name -->
                            <div class="col-md-6">
                                <label for="firstName" class="form-label text-secondary font-weight-bold">First Name</label>
                                <input type="text" id="firstName" name="firstName" th:value="${user.firstName}" class="form-control transit-form-control" required>
                            </div>

                            <!-- Last Name -->
                            <div class="col-md-6">
                                <label for="lastName" class="form-label text-secondary font-weight-bold">Last Name</label>
                                <input type="text" id="lastName" name="lastName" th:value="${user.lastName}" class="form-control transit-form-control" required>
                            </div>

                            <!-- Email Address -->
                            <div class="col-md-6">
                                <label for="email" class="form-label text-secondary font-weight-bold">Email Address</label>
                                <input type="email" id="email" name="email" th:value="${user.email}" class="form-control transit-form-control" required>
                            </div>

                            <!-- Phone Number -->
                            <div class="col-md-6">
                                <label for="phone" class="form-label text-secondary font-weight-bold">Phone Number Contact</label>
                                <input type="text" id="phone" name="phone" th:value="${user.phone}" class="form-control transit-form-control">
                            </div>

                            <hr class="border-secondary my-4">

                            <!-- Change Password Option -->
                            <div class="col-md-12">
                                <label for="newPassword" class="form-label text-secondary font-weight-bold">Update Account Password</label>
                                <input type="password" id="newPassword" name="newPassword" class="form-control transit-form-control" placeholder="Only fill to change password">
                                <small class="text-secondary">Keep blank to retain your existing login password.</small>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-4 pt-2 text-end">
                            <button type="submit" class="btn btn-transit px-4">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Update settings
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts Inclusion -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

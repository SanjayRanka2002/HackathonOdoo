<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TransitOps</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            padding-left: 0 !important; /* Override standard sidebar offset */
        }
    </style>
</head>
<body class="login-bg">
    <div class="login-card">
        <div class="auth-header">
            <h2 class="mb-2"><i class="fa-solid fa-truck-fast me-2"></i>TransitOps</h2>
            <p class="text-secondary mb-0">Enterprise Transport Operations</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>Invalid username or password.</div>
        </div>
        
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <div>You have been successfully logged out.</div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-4">
                <label for="username" class="form-label text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" name="username" class="form-control transit-form-control" placeholder="e.g. admin" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control transit-form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-transit w-100 py-2 mt-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </button>
        </form>

        <div class="mt-4 text-center">
            <small class="text-muted">Use <strong>admin / admin</strong> to access the system.</small>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
